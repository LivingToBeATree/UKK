steps:
  # Step 1: Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend/comme-backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/comme-backend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/comme-backend:latest'
      - '.'

  # Step 2: Push Backend Docker Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/comme-backend'

  # Step 3: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/comme-backend:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--execution-environment=gen2'
      - '--add-volume=name=media-storage,type=cloud-storage,bucket=${_BUCKET_NAME},mount-options=uid=82;gid=82;file-mode=0777;dir-mode=0777'
      - '--add-volume-mount=volume=media-storage,mount-path=/var/www/html/storage/app/public'

substitutions:
  _REGION: 'asia-southeast2'
  _REPO_NAME: 'cloud-run-source-deploy'
  _SERVICE_NAME: 'comme-backend'
  _BUCKET_NAME: 'comme_bucket'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/comme-backend:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/comme-backend:latest'
